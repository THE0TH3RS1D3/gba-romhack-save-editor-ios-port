name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier (change it if your sideloading tool needs a unique one)"
        required: false
        default: "com.example.gen3saveeditor"
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write   # lets tag builds attach the IPA to a GitHub release

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the save-editing engine
        run: node tests/test_engine.js

  build:
    needs: engine-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set bundle identifier
        run: |
          BID="${{ github.event.inputs.bundle_id }}"
          if [ -n "$BID" ]; then sed -i '' "s/com.example.gen3saveeditor/$BID/" project.yml; fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project GBASaveEditor.xcodeproj \
            -scheme GBASaveEditor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/GBASaveEditor.app"
          test -d "$APP/www" || { echo "web assets missing from the app bundle"; ls "$APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry GBASaveEditor.ipa Payload
          ls -lh GBASaveEditor.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GBASaveEditor-ipa
          path: GBASaveEditor.ipa

      - name: Attach IPA to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GBASaveEditor.ipa
